name: AI Code Review with Groq

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - staging

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.php' > pr_diff.txt
          DIFF_LINES=$(wc -l < pr_diff.txt)
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          if [ "$DIFF_LINES" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI Review con Groq
        if: steps.diff.outputs.skip == 'false'
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Leer el diff
          DIFF_CONTENT=$(cat pr_diff.txt)
          
          # Crear JSON para la API
          cat > request.json << 'EOF'
          {
            "model": "llama3-70b-8192",
            "messages": [
              {
                "role": "system",
                "content": "Eres un code reviewer PHP senior. Analiza código con rigor técnico."
              },
              {
                "role": "user",
                "content": "Analiza este código PHP:\n\n```php\n$DIFF_CONTENT\n```\n\nProporciona:\n1. CRÍTICAS: qué está mal\n2. PROBLEMAS: lista con severidad 🔴🟡🟢\n3. SUGERENCIAS\n4. VEREDICTO: ✅/⚠️/❌"
              }
            ],
            "temperature": 0.3,
            "max_tokens": 2000
          }
          EOF
          
          # Reemplazar el diff en el JSON (escapando caracteres especiales)
          sed -i "s|\$DIFF_CONTENT|$DIFF_CONTENT|g" request.json
          
          # Llamar a Groq
          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json
          
          # Extraer respuesta
          ANALYSIS=$(jq -r '.choices[0].message.content' response.json 2>/dev/null || echo "Error en análisis")
          
          # Guardar para el siguiente step
          echo "analysis=$ANALYSIS" >> $GITHUB_OUTPUT

      - name: Comentar en PR
        if: steps.diff.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          ANALYSIS: ${{ steps.review.outputs.analysis }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const analysis = process.env.ANALYSIS || "No se pudo obtener análisis";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **AI Code Review (Groq/Llama 3)**\n\n${analysis}\n\n---\n*Generado automáticamente*`
            });
