name: AI Code Review with Groq

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - staging

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.php' > pr_diff.txt
          DIFF_LINES=$(wc -l < pr_diff.txt)
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          if [ "$DIFF_LINES" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI Review con Groq
        if: steps.diff.outputs.skip == 'false'
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Crear el prompt
          echo "Analiza este código PHP y proporciona un review conciso:" > prompt.txt
          echo "" >> prompt.txt
          cat pr_diff.txt >> prompt.txt
          echo "" >> prompt.txt
          echo "Responde con:" >> prompt.txt
          echo "1. Problemas encontrados (si hay)" >> prompt.txt
          echo "2. Sugerencias de mejora" >> prompt.txt
          echo "3. Veredicto: APROBADO o NECESITA_CAMBIOS" >> prompt.txt
          
          PROMPT=$(cat prompt.txt)
          
          # Llamar a Groq API
          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"llama3-70b-8192\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"Eres un code reviewer PHP senior. Sé conciso y directo.\"},
                {\"role\": \"user\", \"content\": \"$PROMPT\"}
              ],
              \"temperature\": 0.3,
              \"max_tokens\": 1500
            }" > response.json
          
          # Extraer respuesta
          ANALYSIS=$(jq -r '.choices[0].message.content' response.json 2>/dev/null || echo "Error: No se pudo analizar el código")
          
          # Guardar en output
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Análisis completado"

      - name: Comentar en PR
        if: steps.diff.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          ANALYSIS: ${{ steps.review.outputs.analysis }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const analysis = process.env.ANALYSIS || "No se pudo obtener análisis";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **AI Code Review (Groq/Llama 3)**\n\n${analysis}\n\n---\n*Generado automáticamente*`
            });
