name: AI Code Review with Groq

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - staging

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.php' > pr_diff.txt
          DIFF_LINES=$(wc -l < pr_diff.txt)
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          if [ "$DIFF_LINES" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI Review con Groq
        if: steps.diff.outputs.skip == 'false'
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Leer el diff
          DIFF_CONTENT=$(cat pr_diff.txt)
          
          # Guardar el diff en una variable de entorno separada para evitar problemas
          echo "diff_length=$(echo "$DIFF_CONTENT" | wc -c)" >> $GITHUB_OUTPUT
          
          # Crear JSON con el prompt
          # El prompt incluirá el diff directamente
          PROMPT_TEXT="Analiza este código PHP:\n\n$DIFF_CONTENT\n\nProporciona:\n1. Problemas principales\n2. Sugerencias\n3. Veredicto"
          
          # Crear JSON usando jq
          echo '{"model":"llama3-70b-8192","messages":[{"role":"system","content":"Eres un code reviewer PHP senior"},{"role":"user","content":"placeholder"}],"temperature":0.3,"max_tokens":1500}' > template.json
          
          # Reemplazar el placeholder con el prompt real
          jq --arg prompt "$PROMPT_TEXT" '.messages[1].content = $prompt' template.json > request.json
          
          # Debug
          echo "Request JSON creado"
          
          # Llamar a Groq API
          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json
          
          # Extraer respuesta
          if command -v jq &> /dev/null; then
            ANALYSIS=$(jq -r '.choices[0].message.content // "Error: No hay respuesta"' response.json 2>/dev/null)
          else
            ANALYSIS="Error: jq no disponible"
          fi
          
          # Si el análisis está vacío, usar mensaje de error
          if [ -z "$ANALYSIS" ] || [ "$ANALYSIS" = "null" ]; then
            ANALYSIS="No se pudo obtener análisis del código"
          fi
          
          # Guardar en output usando delimitador único
          {
            echo "analysis<<GHA_EOF"
            echo "$ANALYSIS"
            echo "GHA_EOF"
          } >> $GITHUB_OUTPUT

      - name: Comentar en PR
        if: steps.diff.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          ANALYSIS: ${{ steps.review.outputs.analysis }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const analysis = process.env.ANALYSIS || "Error al obtener análisis";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **AI Code Review (Groq/Llama 3)**\n\n' + analysis + '\n\n---\n*Generado automáticamente* 🚀'
            });
