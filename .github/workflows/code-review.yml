name: AI Code Review with Groq

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - staging

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.php' > pr_diff.txt
          DIFF_LINES=$(wc -l < pr_diff.txt)
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          if [ "$DIFF_LINES" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI Review con Groq
        if: steps.diff.outputs.skip == 'false'
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Crear request JSON
          cat > request.json << 'REQUEST_EOF'
          {
            "model": "llama3-70b-8192",
            "messages": [
              {
                "role": "system",
                "content": "Eres un code reviewer PHP senior. Analiza código con rigor técnico."
              },
              {
                "role": "user",
                "content": "Analiza este código PHP y proporciona review conciso con problemas, sugerencias y veredicto final."
              }
            ],
            "temperature": 0.3,
            "max_tokens": 1500
          }
          REQUEST_EOF
          
          # Llamar a Groq
          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json
          
          # Extraer y guardar respuesta
          ANALYSIS=$(jq -r '.choices[0].message.content // "Error: No se pudo obtener respuesta"' response.json)
          
          # Usar delimitador único
          echo "analysis<<GHASECRET" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "GHASECRET" >> $GITHUB_OUTPUT

      - name: Comentar en PR
        if: steps.diff.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          ANALYSIS: ${{ steps.review.outputs.analysis }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const analysis = process.env.ANALYSIS || "Error al obtener análisis";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **AI Code Review (Groq/Llama 3)**\n\n${analysis}\n\n---\n*Generado automáticamente*`
            });
