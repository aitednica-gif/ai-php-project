name: CI - Verificación Automática

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - staging
      - main

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, zip, pdo_mysql
          coverage: xdebug

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction

      # 1. Code Style - Pint ( Laravel PHP Code Style )
      - name: Verificar Code Style
        run: ./vendor/bin/pint --test
        continue-on-error: true

      # 2. PHPStan - Static Analysis
      - name: Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress

      # 3. PHP CodeSniffer - PSR Standards
      - name: Code Sniffer (PSR-12)
        run: ./vendor/bin/phpcs --standard=PSR12 --encoding=utf-8 -n app/

      # 4. PHPUnit/Pest - Tests Unitarios
      - name: Ejecutar Tests Unitarios
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: test_db
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./vendor/bin/pest --colors=never

      # 5. Build de verificación
      - name: Verificar Build
        run: |
          echo "✅ Compilación exitosa"
          ls -la vendor/

      # 6. Reporte de coverage (opcional)
      - name: Coverage Report
        if: success()
        run: |
          echo "✅ Todos los checks pasaron"
          echo "📊 Coverage: $(./vendor/bin/pest --coverage-text 2>/dev/null | grep 'Lines:' || echo 'No coverage')"

  lint-check:
    name: Lint Check (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instalar composer
        run: composer install --prefer-dist --no-interaction

      - name: Pint - Verificar style
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Pint - Auto-fix
        run: ./vendor/bin/pint
        continue-on-error: true

      - name: Commit style fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix code style with Pint"
          file_pattern: "*.php"
        continue-on-error: true
