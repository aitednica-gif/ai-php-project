name: CI - Verificación Automática

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - staging
      - main

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, zip

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction || echo "Composer install failed, continuing..."
        continue-on-error: true

      # 1. Code Style - Pint (optional)
      - name: Verificar Code Style
        run: ./vendor/bin/pint --test || echo "Pint check failed, continuing..."
        continue-on-error: true

      # 2. PHPStan - Static Analysis (optional)
      - name: Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress || echo "PHPStan analysis failed, continuing..."
        continue-on-error: true

      # 3. PHP CodeSniffer - PSR Standards (optional)
      - name: Code Sniffer (PSR-12)
        run: ./vendor/bin/phpcs --standard=PSR12 --encoding=utf-8 -n app/ || echo "PHP_CodeSniffer failed, continuing..."
        continue-on-error: true

      # 4. PHPUnit/Pest - Tests Unitarios (optional)
      - name: Ejecutar Tests Unitarios
        run: ./vendor/bin/pest --colors=never || echo "Tests failed, continuing..."
        continue-on-error: true

      # 5. Build de verificación
      - name: Verificar Build
        run: |
          echo "✅ CI Pipeline completado"
          echo "Nota: Algunos checks pueden haber fallado pero el pipeline continúa"

  lint-check:
    name: Lint Check (no bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instalar composer
        run: composer install --prefer-dist --no-interaction || echo "Composer install failed, skipping lint..."
        continue-on-error: true

      - name: Pint - Verificar style
        run: ./vendor/bin/pint --test || echo "Pint check completed with issues"
        continue-on-error: true

      - name: Pint - Auto-fix
        run: ./vendor/bin/pint || echo "Pint fix completed"
        continue-on-error: true

      - name: Commit style fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix code style with Pint"
          file_pattern: "*.php"
        continue-on-error: true
